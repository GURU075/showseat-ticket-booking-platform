spring.application.name=show-service

server.port=${SERVER_PORT:8083}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/show_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Asia/Kolkata}

spring.flyway.enabled=true

clients.event-service.base-url=${EVENT_SERVICE_URL:http://localhost:8081}
clients.venue-service.base-url=${VENUE_SERVICE_URL:http://localhost:8082}
clients.connect-timeout=${CLIENT_CONNECT_TIMEOUT:2s}
clients.read-timeout=${CLIENT_READ_TIMEOUT:3s}
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
