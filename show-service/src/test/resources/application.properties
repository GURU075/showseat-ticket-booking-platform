spring.datasource.url=jdbc:h2:mem:show_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

clients.event-service.base-url=http://localhost:8081
clients.venue-service.base-url=http://localhost:8082
clients.connect-timeout=100ms
clients.read-timeout=100ms
app.time-zone=Asia/Kolkata
