spring:
  application:
    name: api-gateway

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  # Applies bounded connection/read times to the imperative HTTP client used by
  # Gateway Server MVC. Redirect responses are returned to the caller instead
  # of being followed inside the gateway.
  http:
    clients:
      connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2s}
      read-timeout: ${GATEWAY_READ_TIMEOUT:5s}
      redirects: dont-follow

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: event-service-route
              uri: lb://event-service
              predicates:
                - Path=/api/event/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: eventServiceCircuitBreaker
                    fallbackUri: forward:/internal/fallback/event-service
                    # Treat server-side failures as service failures. Client-side
                    # 4xx responses remain unchanged and do not open the circuit.
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

            - id: venue-service-route
              uri: lb://venue-service
              predicates:
                - Path=/api/v1/cities/**,/api/v1/venues/**,/api/v1/screens/**,/api/v1/venue-seats/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: venueServiceCircuitBreaker
                    fallbackUri: forward:/internal/fallback/venue-service
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

            - id: show-service-route
              uri: lb://show-service
              predicates:
                - Path=/api/v1/shows/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: showServiceCircuitBreaker
                    fallbackUri: forward:/internal/fallback/show-service
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

            - id: seat-inventory-service-route
              uri: lb://seat-inventory-service
              predicates:
                - Path=/api/v1/show-seats/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: seatInventoryServiceCircuitBreaker
                    fallbackUri: forward:/internal/fallback/seat-inventory-service
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

            - id: booking-service-route
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/bookings
              filters:
                - name: CircuitBreaker
                  args:
                    id: bookingServiceCircuitBreaker
                    fallbackUri: forward:/internal/fallback/booking-service
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

      loadbalancer:
        # Avoid hidden retries, especially for non-idempotent POST requests.
        retry:
          enabled: false
        # Build these child contexts at startup instead of on the first request.
        eager-load:
          clients:
            - event-service
            - venue-service
            - show-service
            - seat-inventory-service
            - booking-service
server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful

eureka:
  client:
    service-url:
      # defaultZone is case-sensitive because it is a map key in Eureka.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    # Advertise an address that other local/container instances can reach.
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

# Browser cross-origin policy. Keep the origin list explicit; never use "*"
# when credentials are enabled. CORS applies only to public API paths.
gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:1h}

  # Per-client token buckets. Each downstream service has an independent quota,
  # so heavy Event traffic cannot consume the Show or Inventory allowance.
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    max-buckets: ${GATEWAY_RATE_LIMIT_MAX_BUCKETS:10000}
    bucket-expiration: ${GATEWAY_RATE_LIMIT_BUCKET_EXPIRATION:10m}
    policies:
      event-service:
        capacity: ${EVENT_RATE_LIMIT_CAPACITY:10}
        refill-tokens: ${EVENT_RATE_LIMIT_REFILL_TOKENS:10}
        refill-period: ${EVENT_RATE_LIMIT_REFILL_PERIOD:1m}
      venue-service:
        capacity: ${VENUE_RATE_LIMIT_CAPACITY:120}
        refill-tokens: ${VENUE_RATE_LIMIT_REFILL_TOKENS:120}
        refill-period: ${VENUE_RATE_LIMIT_REFILL_PERIOD:1m}
      show-service:
        capacity: ${SHOW_RATE_LIMIT_CAPACITY:120}
        refill-tokens: ${SHOW_RATE_LIMIT_REFILL_TOKENS:120}
        refill-period: ${SHOW_RATE_LIMIT_REFILL_PERIOD:1m}
      seat-inventory-service:
        capacity: ${SEAT_INVENTORY_RATE_LIMIT_CAPACITY:120}
        refill-tokens: ${SEAT_INVENTORY_RATE_LIMIT_REFILL_TOKENS:120}
        refill-period: ${SEAT_INVENTORY_RATE_LIMIT_REFILL_PERIOD:1m}
      booking-service:
        # Booking creates are more expensive and write data, so use a lower quota.
        capacity: ${BOOKING_RATE_LIMIT_CAPACITY:30}
        refill-tokens: ${BOOKING_RATE_LIMIT_REFILL_TOKENS:30}
        refill-period: ${BOOKING_RATE_LIMIT_REFILL_PERIOD:1m}

management:
  endpoints:
    web:
      exposure:
        # Keep management exposure minimal until authentication is configured.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[correlationId=%X{correlationId:-none}] "

resilience4j:
  circuitbreaker:
    instances:
      eventServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${EVENT_CIRCUIT_BREAKER_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${EVENT_CIRCUIT_BREAKER_MINIMUM_CALLS:5}
        failureRateThreshold: ${EVENT_CIRCUIT_BREAKER_FAILURE_RATE:50}
        permittedNumberOfCallsInHalfOpenState: ${EVENT_CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
        waitDurationInOpenState: ${EVENT_CIRCUIT_BREAKER_OPEN_WAIT:10s}
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # An unavailable Event Service should not make the Gateway itself
        # unhealthy and trigger unnecessary container restarts.
        registerHealthIndicator: false
      venueServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${VENUE_CIRCUIT_BREAKER_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${VENUE_CIRCUIT_BREAKER_MINIMUM_CALLS:5}
        failureRateThreshold: ${VENUE_CIRCUIT_BREAKER_FAILURE_RATE:50}
        permittedNumberOfCallsInHalfOpenState: ${VENUE_CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
        waitDurationInOpenState: ${VENUE_CIRCUIT_BREAKER_OPEN_WAIT:10s}
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: false
      showServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${SHOW_CIRCUIT_BREAKER_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${SHOW_CIRCUIT_BREAKER_MINIMUM_CALLS:5}
        failureRateThreshold: ${SHOW_CIRCUIT_BREAKER_FAILURE_RATE:50}
        permittedNumberOfCallsInHalfOpenState: ${SHOW_CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
        waitDurationInOpenState: ${SHOW_CIRCUIT_BREAKER_OPEN_WAIT:10s}
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: false
      seatInventoryServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${SEAT_INVENTORY_CIRCUIT_BREAKER_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${SEAT_INVENTORY_CIRCUIT_BREAKER_MINIMUM_CALLS:5}
        failureRateThreshold: ${SEAT_INVENTORY_CIRCUIT_BREAKER_FAILURE_RATE:50}
        permittedNumberOfCallsInHalfOpenState: ${SEAT_INVENTORY_CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
        waitDurationInOpenState: ${SEAT_INVENTORY_CIRCUIT_BREAKER_OPEN_WAIT:10s}
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: false
      bookingServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${BOOKING_CIRCUIT_BREAKER_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${BOOKING_CIRCUIT_BREAKER_MINIMUM_CALLS:5}
        failureRateThreshold: ${BOOKING_CIRCUIT_BREAKER_FAILURE_RATE:50}
        permittedNumberOfCallsInHalfOpenState: ${BOOKING_CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
        waitDurationInOpenState: ${BOOKING_CIRCUIT_BREAKER_OPEN_WAIT:10s}
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: false
  timelimiter:
    instances:
      eventServiceCircuitBreaker:
        # Keep this lower than spring.http.clients.read-timeout (5s).
        timeoutDuration: ${EVENT_SERVICE_TIMEOUT:4s}
        cancelRunningFuture: true
      venueServiceCircuitBreaker:
        timeoutDuration: ${VENUE_SERVICE_TIMEOUT:4s}
        cancelRunningFuture: true
      showServiceCircuitBreaker:
        timeoutDuration: ${SHOW_SERVICE_TIMEOUT:4s}
        cancelRunningFuture: true
      seatInventoryServiceCircuitBreaker:
        timeoutDuration: ${SEAT_INVENTORY_SERVICE_TIMEOUT:4s}
        cancelRunningFuture: true
      bookingServiceCircuitBreaker:
        timeoutDuration: ${BOOKING_SERVICE_TIMEOUT:4s}
        cancelRunningFuture: true
