spring:
  application:
    name: booking-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:20000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${PAYMENT_EVENTS_GROUP:booking-service-payment-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  cloud:
    openfeign:
      client:
        config:
          show-service:
            connect-timeout: ${CLIENT_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${CLIENT_READ_TIMEOUT_MS:3000}
            logger-level: basic
          seat-inventory-service:
            connect-timeout: ${CLIENT_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${CLIENT_READ_TIMEOUT_MS:3000}
            logger-level: basic
          payment-service:
            connect-timeout: ${CLIENT_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${CLIENT_READ_TIMEOUT_MS:3000}
            logger-level: basic

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

booking:
  currency: ${BOOKING_CURRENCY:INR}
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  payment-events-topic: ${PAYMENT_EVENTS_TOPIC:payment-events.v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    correlation: "[correlationId=%X{correlationId:-none}] "
