spring.datasource.url=jdbc:h2:mem:seat_inventory_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

clients.show-service.base-url=http://localhost:18083
clients.venue-service.base-url=http://localhost:18082
spring.cloud.openfeign.client.config.show-service.connect-timeout=100
spring.cloud.openfeign.client.config.show-service.read-timeout=100
spring.cloud.openfeign.client.config.venue-service.connect-timeout=100
spring.cloud.openfeign.client.config.venue-service.read-timeout=100

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=100ms
spring.data.redis.timeout=100ms
spring.data.redis.repositories.enabled=false
seat-lock.ttl=5m
seat-lock.confirmation-ttl=1m
