spring.application.name=seat-inventory-service

server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seat_inventory_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

clients.show-service.base-url=${SHOW_SERVICE_URL:http://localhost:8083}
clients.venue-service.base-url=${VENUE_SERVICE_URL:http://localhost:8082}

spring.cloud.openfeign.client.config.show-service.connect-timeout=${CLIENT_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.show-service.read-timeout=${CLIENT_READ_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.show-service.logger-level=basic
spring.cloud.openfeign.client.config.venue-service.connect-timeout=${CLIENT_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.venue-service.read-timeout=${CLIENT_READ_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.venue-service.logger-level=basic

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

seat-lock.ttl=${SEAT_LOCK_TTL:5m}
seat-lock.confirmation-ttl=${SEAT_LOCK_CONFIRMATION_TTL:1m}
