spring:
  datasource:
    url: jdbc:h2:mem:payment_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
eureka:
  client:
    enabled: false
payment:
  events-topic: payment-events.v1
  outbox:
    enabled: false
